name: Desktop installer builds
on:
  workflow_dispatch:
  push:
    branches: [desktop-installer]
    paths: ['desktop/**', 'scripts/installer_*.py', 'scripts/desktop_licenses.py', 'scripts/local-device.py', 'scripts/permanent-image.py', 'scripts/package-desktop.py', 'tests/desktop*', 'tests/fixtures/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Linux filesystem tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools libegl1 libxkbcommon-x11-0 libxcb-cursor0 fontconfig
      - name: macOS filesystem tool
        if: runner.os == 'macOS'
        run: brew install squashfs
      - name: Offline backend tests
        run: python -m unittest discover -s tests -p desktop_tests.py -v
      - name: Stock ADB protocol tests
        run: python -m unittest discover -s tests -p desktop_transport_tests.py -v
      - name: Native GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p desktop_gui_tests.py -v
      - name: Build Windows
        if: runner.os == 'Windows'
        run: python scripts/package-desktop.py --output .desktop-build
      - name: Build macOS and Linux
        if: runner.os != 'Windows'
        run: python scripts/package-desktop.py --output .desktop-build --mksquashfs "$(command -v mksquashfs)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: .desktop-build/release/*
          if-no-files-found: error
